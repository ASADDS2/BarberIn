<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BARBERIN - Login</title>
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo-container">
          <img
            src="../src/img/logos/kcoda.webp"
            alt="Logo KCoda"
            style="height: 100px; width: 100px"
          />
        </div>
        <div class="main-title" style="display: flex; justify-content: center">
          <img
            src="../src/img/logos/barberin.webp"
            alt="Logo barberin"
            style="height: 220px; width: 500px"
          />
        </div>
      </div>

      <div class="app-slogan">App slogan</div>

      <div class="main-content">
        <div class="side-image">
          <img src="../src/img/examples/kcodaexample1.webp" alt="utils">
        </div>

        <div class="login-container">
       
          <div id="message-container"></div>
          
          <form>
            <div class="form-group">
              <label for="usuario">EMAIL</label>
              <div class="input-wrapper">
                <input type="text" id="usuario" name="usuario" required />
                <div class="selector" id="userTypeSelector">
                  ▼
                  <div class="dropdown" id="userTypeDropdown">
                    <div class="dropdown-item" onclick="selectUserType('User')">
                      User
                    </div>
                    <div
                      class="dropdown-item"
                      onclick="selectUserType('Barber')"
                    >
                      Barber
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="password">PASSWORD</label>
              <div class="input-wrapper">
                <input type="password" id="password" name="password" required />
                <div class="selector" onclick="togglePasswordVisibility()">👁</div>
              </div>
            </div>

            <div class="login-section">
              <button type="submit" class="btn-login">Log in</button>
              <!-- Botón de Google con funcionalidad -->
              
            </div>

            <div class="form-links">
              <a href="./register.html">Sign up</a>
              <a href="#">Forgot your password?</a>
            </div>
          </form>
        </div>

        <div class="side-image">
          <img src="../src/img/examples/kcodaexample2.webp" alt="barbers example">
        </div>
      </div>
    </div>

    <script>
      // Toggle dropdown for user type selector
      document
        .getElementById("userTypeSelector")
        .addEventListener("click", function (e) {
          e.stopPropagation();
          const dropdown = document.getElementById("userTypeDropdown");
          dropdown.classList.toggle("show");
        });

      // Close dropdown when clicking outside
      document.addEventListener("click", function () {
        const dropdown = document.getElementById("userTypeDropdown");
        dropdown.classList.remove("show");
      });

      // Select user type function
      function selectUserType(type) {
        console.log("Selected user type:", type);
        const dropdown = document.getElementById("userTypeDropdown");
        dropdown.classList.remove("show");
        // You can add additional logic here to handle the selection
      }

      // Toggle password visibility
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const selector = document.querySelector("#password + .selector");
        
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          selector.innerHTML = "👁";
        } else {
          passwordInput.type = "password";
          selector.innerHTML = "👁";
        }
      }

      // Función para mostrar mensajes
     
      function handleGoogleLogin() {
        console.log('Iniciando login con Google...');
        
        const googleBtn = document.querySelector('.google-login');
        googleBtn.innerHTML = '...';
        googleBtn.disabled = true;
        
       
        window.location.href = 'http://localhost:3000/auth/google';
      }

     
      function checkGoogleAuthResult() {
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        
        if (error === 'auth_failed') {
          showMessage('Error en la autenticación con Google. Por favor intenta nuevamente.', 'error');
        }
      }

      
      function showMessage(message, type = 'info') {
        const container = document.getElementById('message-container');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        messageDiv.style.cssText = `
          padding: 10px;
          margin: 10px 0;
          border-radius: 4px;
          font-size: 14px;
          ${type === 'error' ? 'background: #fee; border: 1px solid #fcc; color: #c00;' : 
            type === 'success' ? 'background: #efe; border: 1px solid #cfc; color: #060;' :
            'background: #e7f3ff; border: 1px solid #b3d9ff; color: #0066cc;'}
        `;
        messageDiv.textContent = message;
        
        
        container.innerHTML = '';
        container.appendChild(messageDiv);
        
      
        setTimeout(() => {
          if (messageDiv.parentNode) {
            messageDiv.remove();
          }
        }, 5000);
      }

      
      document.addEventListener('DOMContentLoaded', function() {
        checkGoogleAuthResult();
      });
    </script>
    <script src="../src/js/login.js"></script>
  </body>
</html>
