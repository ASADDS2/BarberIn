<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css');
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header con logo -->
    <header class="bg-white shadow-sm p-4">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-black rounded-lg flex items-center justify-center mr-3">
                <div class="grid grid-cols-2 gap-1">
                    <div class="w-2 h-2 bg-white rounded-sm"></div>
                    <div class="w-2 h-2 bg-white rounded-sm"></div>
                    <div class="w-2 h-2 bg-white rounded-sm"></div>
                    <div class="w-2 h-2 bg-white rounded-sm"></div>
                </div>
            </div>
            <span class="text-gray-700 font-medium">logo Kcoda</span>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="max-w-4xl mx-auto p-6">
        <!-- Título principal -->
        <div class="bg-gray-300 rounded-lg p-8 mb-8">
            <h1 class="text-6xl font-black text-center text-black italic transform -skew-x-12">
                BARBERIN
            </h1>
        </div>

        <!-- Contenedor de imágenes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Espacio para imagen 1 -->
            <div class="bg-gray-300 rounded-lg h-48 flex items-center justify-center">
                <div class="text-center text-gray-600">
                    <svg class="w-16 h-16 mx-auto mb-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path>
                    </svg>
                    <p class="text-sm font-medium">COLOCA TU IMAGEN AQUÍ</p>
                </div>
            </div>

            <!-- Espacio para imagen 2 -->
            <div class="bg-gray-300 rounded-lg h-48 flex items-center justify-center">
                <div class="text-center text-gray-600">
                    <svg class="w-16 h-16 mx-auto mb-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path>
                    </svg>
                    <p class="text-sm font-medium">COLOCA TU IMAGEN AQUÍ</p>
                </div>
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="flex justify-center gap-4 mb-8">
            <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-lg transition-colors">
                LOG IN
            </button>
            <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-lg transition-colors">
                SING UP
            </button>
        </div>

        <!-- Sección de descripción -->
        <div class="bg-gray-200 border-2 border-blue-400 rounded-lg p-6">
            <h2 class="text-2xl font-bold text-center text-black underline mb-4">
                APP SLOGAN
            </h2>
            <p class="text-center text-gray-700 font-medium">
                APP DESCRIPTION
            </p>
        </div>
    </main>

    <!-- Footer con iconos de redes sociales -->
    <footer class="mt-12 p-6">
        <div class="flex justify-center gap-6">
            <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">
                f
            </div>
            <div class="w-12 h-12 bg-pink-500 rounded-full flex items-center justify-center text-white font-bold">
                IG
            </div>
            <div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center text-white font-bold">
                W
            </div>
            <div class="w-12 h-12 bg-blue-400 rounded-full flex items-center justify-center text-white font-bold">
                T
            </div>
            <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white font-bold">
                Y
            </div>
            <div class="w-12 h-12 bg-orange-500 rounded-full flex items-center justify-center text-white font-bold">
                S
            </div>
        </div>
        <div class="text-center text-gray-500 text-sm mt-4">
            10:27 AM
        </div>
    </footer>
</body>
</html>
