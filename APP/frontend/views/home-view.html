<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BARBERIN</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/home.css" />
</head>

<body>
  <div class="container">
    <!-- Header con logo pequeño KCoda -->
    <header class="header">
      <img src="/BarberIn/APP/frontend/src/img/logos/kcoda.webp" alt="Logo KCoda" class="logo-kcoda" />
    </header>

    <!-- Logo principal -->
    <div class="main-title">
      <img src="/BarberIn/APP/frontend/src/img/logos/barberin.webp" alt="Logo Barberin" class="logo-barberin" />
    </div>

    <!-- Sección de tarjetas -->
    <section class="cards-container">
      <div class="card">
        <h3>Servicios</h3>
        <p>Cortes clásicos, modernos y personalizados con estilo.</p>
      </div>
      <div class="card">
        <h3>Reservas</h3>
        <p>Agenda tu cita fácilmente desde la aplicación.</p>
      </div>
    </section>

    <!-- Botones de acción -->
    <div class="buttons-container">
      <a href="./login.html" class="btn btn-login">Sign In</a>
      <a href="./register.html" class="btn btn-signup">Sign Up</a>
    </div>

    <!-- Info Box -->
    <div class="info-box">
      <h2>Estilo & Confianza</h2>
      <p>Tu barbería de confianza, ahora más cerca de ti.</p>
    </div>

    <!-- Footer -->
    <footer>
      <a href="#" class="footer-link">About us</a>
    </footer>
  </div>
</body>

</html>
