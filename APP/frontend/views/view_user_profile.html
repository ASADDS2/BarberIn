<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barberin Dashboard</title>

    <!-- Montserrat -->
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap"
      rel="stylesheet"
    />

    <!--  look & feel  home) -->
    <link rel="stylesheet" href="../src/css/view_user_profile.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo-text">Kcoda logo</div>
    </div>

    <div class="dashboard-container">
      <!-- Left Panel: Profile and Data -->
      <div class="profile-panel">
        <div class="profile-card">
          <div class="edit-icon">✏</div>
          <div class="profile-photo"></div>
          <div class="profile-name">NAME</div>
        </div>

        <div class="data-panel">
          <div class="edit-icon">✏</div>
          <div class="data-item">DATA</div>
          <div class="data-item">DATA</div>
          <div class="data-item">DATA</div>
          <div class="data-item">DATA</div>
          <div class="data-item">DATA</div>
        </div>
      </div>

      <!-- Center Panel: Appointments -->
      <div class="appointments-panel">
        <div class="active-appointment">
          <div class="appointment-header">ACTIVE APPOINTMENT</div>
          <div class="appointment-data">APPOINTMENT DATA</div>
          <div class="appointment-actions">
            <button class="score-btn">SCORE</button>
            <button class="cancel-btn">CANCEL</button>
          </div>
        </div>

        <div class="history-section">
          <div class="history-header">APPOINTMENT HISTORY</div>
          <div class="history-item">APPOINTMENT DATA</div>
          <div class="history-item">APPOINTMENT DATA</div>
        </div>
      </div>

      <!-- Right Panel: Barbershops and Barbers -->
      <div class="barbershops-panel">
        <div class="section-header">FAVORITE BARBERSHOPS</div>

        <div class="barbershop-item">
          <div class="barbershop-name">BARBERSHOP NAME</div>
          <div class="rating">4.8</div>
        </div>

        <div class="barbershop-item">
          <div class="barbershop-name">BARBERSHOP NAME</div>
          <div class="rating">4.7</div>
        </div>

        <div class="barbershop-item">
          <div class="barbershop-name">BARBERSHOP NAME</div>
          <div class="rating">4.9</div>
        </div>

        <div class="barbers-section">
          <div class="section-header">FAVORITE BARBERS</div>

          <div class="barber-item">
            <div class="barber-photo">👨</div>
            <div class="barber-name">NAME</div>
          </div>

          <div class="barber-item">
            <div class="barber-photo">👨</div>
            <div class="barber-name">NAME</div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer-barberin">
      <div class="main-title" style="display: flex; justify-content: center">
        <img
          src="/APP/frontend/src/img/logos/barberin.webp"
          alt="Logo barberin"
          style="height: 60px; width: 140px"
        />
      </div>
    </footer>
  </body>
</html>
