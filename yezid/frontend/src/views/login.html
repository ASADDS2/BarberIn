<div>
    <h1 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h1>

    <form id="loginForm" class="space-y-4">
        <input type="email" placeholder="Correo electrónico"
            class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        <input type="password" placeholder="Contraseña"
            class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
            Ingresar
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-500 mb-2">o inicia con</p>
        <a href="http://localhost:4000/auth/google"
            class="w-full flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2 hover:bg-gray-100 transition">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5">
            <span>Google</span>
        </a>
    </div>
</div>
