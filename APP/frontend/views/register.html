<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barberin - Register</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/register.css" />
</head>

<body>
  <div class="top-nav">
    <div class="nav-left">Register User</div>
    <div class="nav-right">
      <button class="toggle-btn" onclick="toggleRegisterMode()">
        <span id="toggle-text">Register Barbaershops</span>
      </button>
    </div>
  </div>

  <div class="main-container">
    <!-- Panel usuario -->
    <div id="user-register" class="register-panel">
      <div class="panel-header">
        <div class="main-title" style="display: flex; justify-content: center">
          <img src="../src/img/logos/barberin.webp" alt="Logo barberin" style="height: 220px; width: 400px" />
        </div>
      </div>
      <div class="register-subtitle">Register user</div>

      <div class="form-layout">
        <div class="form-section">
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" placeholder="Ex: juan" />
            </div>
            <div class="form-group">
              <label>Last name</label>
              <input type="text" placeholder="Ex: Arnache" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="example@gmail.com" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" placeholder="minimun 10 numbers" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Password</label>
              <input type="password" placeholder="********" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Address</label>
              <input type="text" placeholder="Ej: Calle 123 #45-67" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Age</label>
              <select>
                <option>Select...</option>
                <option>18-25</option>
                <option>26-35</option>
                <option>36-45</option>
                <option>46+</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-login">Register</button>
            <button class="btn btn-signup">
              <span class="google-icon">G</span>
              Register with Google
            </button>
            <span class="login-link"><a href="./login.html"> Already have an account?</a></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel barbería -->
    <div id="barber-register" class="register-panel hidden">
      <div class="panel-header">
        <div class="main-title" style="display: flex; justify-content: center">
          <img src="../src/img/logos/barberin.webp" alt="Logo barberin" style="height: 220px; width: 400px" />
        </div>
      </div>
      <div class="register-subtitle">Register Barbershops</div>

      <div class="form-layout">
        <div class="form-section">
          <div class="form-row">
            <div class="form-group">
              <label>Name of Barbershop</label>
              <input type="text" placeholder="Ex: BarberShop Pro" />
            </div>
            <div class="form-group">
              <label>Email Barbershop</label>
              <input type="email" placeholder="example@barbershop.com" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Phone Barbershop</label>
              <input type="tel" placeholder="+57 310 000 0000" />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" placeholder="********" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Name Responsible</label>
              <input type="text" placeholder="Ex: Carlos Gómez" />
            </div>
            <div class="form-group">
              <label> Document ID</label>
              <input type="text" placeholder="CC/NIT" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label> Owner Telephone</label>
              <input type="tel" placeholder="+57 320 111 2233" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group full-width">
              <label> Address Barbershop</label>
              <textarea placeholder="Ex: Carrera 45 #12-34"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-login">Register</button>
            <button class="btn btn-signup">
              <span class="google-icon">G</span>
              Register with Google
            </button>
            <span class="login-link"><a href="./login.html"> Already have an account?</a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../src/js/register.js"></script>
</body>

</html>
