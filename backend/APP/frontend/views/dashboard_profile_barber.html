<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Dashboard</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="./css/dashboard_profile_barber.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header>
            <div class="logo">Kcoda logo</div>
            <div class="barber-name">
                <div class="barber-name-box">BARBER NAME</div>
            </div>
            <div class="qualification">
                <div class="qualification-title">QUALIFICATION</div>
                <div class="rating">
                    <div class="thumbs-up">👍</div>
                    <div class="stars">★★</div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Column - Appointments -->
            <aside class="appointments">
                <h2>Appointments</h2>
                <div class="appointment-card">
                    <span class="appointment-text">Client Appointment</span>
                    <button class="take-button">TAKE</button>
                </div>
                <div class="appointment-card">
                    <span class="appointment-text">Client Appointment 1</span>
                    <button class="take-button">TAKE</button>
                </div>
                <div class="appointment-card">
                    <span class="appointment-text">Client Appointment 2</span>
                    <button class="take-button">TAKE</button>
                </div>
                <div class="appointment-card">
                    <span class="appointment-text">Client Appointment 3</span>
                    <button class="take-button">TAKE</button>
                </div>
            </aside>

            <!-- Center Column - Profile -->
            <main class="profile">
                <div class="profile-top">
                    <div class="avatar-section">
                        <div class="avatar-box">
                            <div class="avatar-image">👤</div>
                        </div>
                        <div class="name-box">
                            <span>NAME</span>
                            <span class="edit-icon">✏️</span>
                        </div>
                    </div>
                    <div class="info-boxes">
                        <div class="description-box">
                            <span class="box-title">Descriptions</span>
                            <span class="box-edit-icon">✏️</span>
                        </div>
                        <div class="specialties-box">
                            <span class="box-title">Specialties</span>
                            <span class="box-edit-icon">✏️</span>
                        </div>
                    </div>
                </div>

                <div class="haircut-references">
                    <h3>Haircut References</h3>
                    <div class="references-grid">
                        <div class="reference-item">
                            <div class="reference-image">🖼️</div>
                            <div class="reference-description desc-blue">Description</div>
                        </div>
                        <div class="reference-item">
                            <div class="reference-image">🖼️</div>
                            <div class="reference-description desc-red">Description</div>
                        </div>
                        <div class="reference-item">
                            <div class="reference-image">🖼️</div>
                            <div class="reference-description desc-blue">Description</div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Right Column - Ranking -->
            <aside class="ranking">
                <div class="ranking-title">RANKING</div>
                <div class="ranking-box">#1</div>
            </aside>
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-title">BARBERIN</div>
        </footer>
    </div>
</body>
</html>
