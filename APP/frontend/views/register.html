<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barberin - Registro</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/register.css" />
</head>

<body>
  <div class="top-nav">
    <div class="nav-left">Registro de Usuario</div>
    <div class="nav-right">
      <button class="toggle-btn" onclick="toggleRegisterMode()">
        <span id="toggle-text">Registrar Barberías</span>
      </button>
    </div>
  </div>

  <div class="main-container">
    <!-- Panel usuario -->
    <div id="user-register" class="register-panel">
      <div class="panel-header">
        <div class="main-title" style="display: flex; justify-content: center">
          <img src="../src/img/logos/barberin.png" alt="Logo barberin" style="height: 220px; width: 400px" />
        </div>
      </div>
      <div class="register-subtitle">Registro de Usuario</div>

      <div class="form-layout">
        <div class="form-section">
          <div class="form-row">
            <div class="form-group">
              <label>Nombres</label>
              <input type="text" placeholder="Ej: Juan" />
            </div>
            <div class="form-group">
              <label>Apellidos</label>
              <input type="text" placeholder="Ej: Pérez" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="ejemplo@email.com" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Teléfono</label>
              <input type="tel" placeholder="+57 300 123 4567" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Contraseña</label>
              <input type="password" placeholder="********" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Dirección</label>
              <input type="text" placeholder="Ej: Calle 123 #45-67" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Edad</label>
              <select>
                <option>Seleccione...</option>
                <option>18-25</option>
                <option>26-35</option>
                <option>36-45</option>
                <option>46+</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-login">Registrar</button>
            <button class="btn btn-signup">
              <span class="google-icon">G</span>
              Registrar con Google
            </button>
            <span class="login-link"><a href="./login.html">¿Ya tienes cuenta?</a></span>

          </div>
        </div>
      </div>
    </div>

    <!-- Panel barbería -->
    <div id="barber-register" class="register-panel hidden">
      <div class="panel-header">
        <div class="brand-title">BARBERIN</div>
      </div>
      <div class="register-subtitle">Registro de Barbería</div>

      <div class="form-layout">
        <div class="form-section">
          <div class="form-row">
            <div class="form-group">
              <label>Nombre Barbería</label>
              <input type="text" placeholder="Ej: BarberShop Pro" />
            </div>
            <div class="form-group">
              <label>Email Barbería</label>
              <input type="email" placeholder="ejemplo@barberia.com" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Teléfono Barbería</label>
              <input type="tel" placeholder="+57 310 000 0000" />
            </div>
            <div class="form-group">
              <label>Contraseña</label>
              <input type="password" placeholder="********" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Nombre Responsable</label>
              <input type="text" placeholder="Ej: Carlos Gómez" />
            </div>
            <div class="form-group">
              <label>ID Documento</label>
              <input type="text" placeholder="CC/NIT" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Teléfono Propietario</label>
              <input type="tel" placeholder="+57 320 111 2233" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group full-width">
              <label>Dirección Barbería</label>
              <textarea placeholder="Ej: Carrera 45 #12-34"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn register-btn">Registrar</button>
            <button class="btn btn-signup">
              <span class="google-icon">G</span>
              Registrar con Google
            </button>
            <span class="login-link"><a href="./login.html">¿Ya tienes cuenta?</a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../src/js/register.js"></script>
</body>

</html>
